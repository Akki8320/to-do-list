<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun To-Do List ✨</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Zen+Maru+Gothic:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="background-gradient"></div>
    <div class="app-container">
        <header>
            <h1 id="app-title">Daily Quests <div id="dino-container">
                    <img id="dino-img" src="dino_pirate.png" alt="dino_pirate.png">
                </div>
            </h1>
            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-label">Streak</span>
                    <span class="stat-value" id="streak-count">0</span>
                    <span class="stat-icon">🔥</span>
                </div>
                <div class="stat-item date-time-group">
                    <span class="stat-value" id="current-time">--:--</span>
                    <span class="stat-label" id="current-date">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Level</span>
                    <span class="stat-value" id="level-count">1</span>
                    <span class="stat-icon">⭐</span>
                </div>
                <div class="xp-bar-container">
                    <div class="xp-bar" id="xp-bar"></div>
                </div>
            </div>

            <div class="controls-container">
                <div class="pet-container" id="pet-container">
                    <div class="pet-avatar" id="pet-avatar">🥚</div>
                    <div class="pet-message" id="pet-message">...</div>
                </div>
                <select id="theme-select" class="theme-select">
                    <option value="default">✨ Space</option>
                    <option value="cozy">☕ Cozy</option>
                    <option value="forest">🌿 Forest</option>
                    <option value="ocean">🌊 Ocean</option>
                </select>
                <button id="history-btn" class="icon-btn" title="Weekly Memories">
                    📜
                </button>
                <button id="reset-btn" class="icon-btn" title="Reset Level">
                    ↺
                </button>
                <button id="clear-completed-btn" class="icon-btn" title="Clear Completed Tasks">
                    🧹
                </button>
            </div>
        </header>

        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="quests">Quests</button>
            <button class="tab-btn" data-tab="learnings">Learnings</button>
        </nav>

        <main>
            <section id="quests-section" class="tab-content active">
                <div class="input-group">
                    <input type="text" id="task-input" placeholder="Add a new quest..." autocomplete="off">
                    <button id="add-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>

                <ul id="task-list" class="task-list">
                    <!-- Tasks will be injected here -->
                </ul>

                <div class="empty-state" id="empty-state">
                    <p>No active quests. Time to relax! 🌿</p>
                </div>
            </section>

            <section id="learnings-section" class="tab-content">
                <div class="input-group">
                    <textarea id="memo-input" placeholder="What did you learn today? (1% better!)" rows="1"></textarea>
                    <button id="add-memo-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </button>
                </div>
                <div id="memo-list" class="memo-list">
                    <!-- Memos will be injected here -->
                </div>
                <div class="empty-state" id="memo-empty-state">
                    <p>Your learnings are empty. Record your knowledge! 📖</p>
                </div>
            </section>
        </main>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Weekly Memories</h2>
                <button id="close-history" class="close-btn">&times;</button>
            </div>
            <div id="history-list" class="history-list">
                <!-- History content injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
